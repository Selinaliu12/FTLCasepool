# Supabase 免費專案約一週沒有活動會暫停，暫停後網站打不開。
# 每 3 天打一次 /api/health（它會真的查一次資料庫）。也可以在 GitHub 的 Actions 分頁手動執行。
name: keep-alive

on:
  schedule:
    - cron: "0 1 */3 * *" # 每 3 天，台北時間 09:00
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 https://ftl-casepool.vercel.app/api/health
